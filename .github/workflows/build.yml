name: Build VN007Plus Controller APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p extracted

          ARCHIVE=$(find . -maxdepth 1 -type f \( -name "*.7z" -o -name "*.zip" \) | head -n 1)

          if [ -z "$ARCHIVE" ]; then
            echo "Archive file not found"
            exit 1
          fi

          echo "Using archive: $ARCHIVE"

          7z x "$ARCHIVE" -oextracted

          ZIPFILE=$(find extracted -type f -name "*.zip" | head -n 1)

          if [ -n "$ZIPFILE" ]; then
            echo "Nested ZIP found: $ZIPFILE"
            mkdir -p extracted/project
            7z x "$ZIPFILE" -oextracted/project
          fi

          ROOT=$(find extracted -type f -name "settings.gradle" -printf "%h\n" | head -n 1)

          if [ -z "$ROOT" ]; then
            ROOT=$(find extracted -type f -name "settings.gradle.kts" -printf "%h\n" | head -n 1)
          fi

          if [ -z "$ROOT" ]; then
            echo "Android project not found"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          echo "Android project found at: $ROOT"

          cp -a "$ROOT"/. ./
        
      
          

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VN007Plus-Controller-debug
          path: app/build/outputs/apk/debug/app-debug.apk
